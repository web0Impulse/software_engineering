<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/signup.css">
</head>
<body>
    <div class="registration-container">
        <div class="registration-header">
            <h1 class="registration-title">Регистрация</h1>
            <p class="registration-subtitle">Создайте новую учетную запись</p>
        </div>

        <form action="/register" method="POST" id="registrationForm">
            <div class="db-error" id="dbError">
                {{ dbError }}
            </div>
            <div class="form-group">
                <label for="company" class="form-label">Название компании</label>
                <input
                    type="text"
                    id="company_name"
                    name="company_name"
                    class="form-input"
                    placeholder="Введите название вашей фирмы"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Логин</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    class="form-input"
                    placeholder="Придумайте логин"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <div class="password-group">
                  <input
                      type="password"
                      id="password"
                      name="password"
                      class="form-input"
                      placeholder="Придумайте пароль"
                      required
                  >
                  <button type="button" class="visible-button" id="password-visible-button">&#x1F441</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">Подтверждение пароля</label>
                <div class="password-group">
                  <input
                      type="password"
                      id="confirm-password"
                      name="confirm-password"
                      class="form-input"
                      placeholder="Повторите пароль"
                      required
                  >
                  <button type="button" class="visible-button" id="confirm-password-visible-button">&#x1F441</button>
                </div>
                <div class="password-match" id="passwordMatchMessage">
                    Пароли не совпадают
                </div>
            </div>

            <button type="submit" class="registration-button" id="submitButton">Зарегистрироваться</button>

            <div class="form-footer">
                <a href="/login" class="login-link">Уже есть аккаунт? Войти</a>
            </div>
        </form>
    </div>

    <script src="./js/signup.js" charset="utf-8"></script>
</body>
</html>
