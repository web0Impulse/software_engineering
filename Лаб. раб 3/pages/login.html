<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #3AAACF 0%, #61B4CF 100%);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #024E68;
            border-radius: 10px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            color: white;
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #61B4CF;
            font-size: 1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #216278;
            border-radius: 5px;
            background: #06799F;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3AAACF;
            background: #024E68;
        }

        .form-input::placeholder {
            color: #61B4CF;
        }

        .login-button {
            background: linear-gradient(135deg, #3AAACF 0%, #06799F 100%);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px 30px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            float: right;
            min-width: 120px;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #06799F 0%, #3AAACF 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .form-footer {
            clear: both;
            padding-top: 20px;
            text-align: center;
        }

        .forgot-password {
            color: #61B4CF;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #3AAACF;
            text-decoration: underline;
        }

        /* Адаптивность для планшетов */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
                margin: 20px;
            }

            .login-title {
                font-size: 1.7rem;
            }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px 15px;
                margin: 10px;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .login-button {
                width: 100%;
                float: none;
                margin-top: 10px;
            }

            .form-input {
                padding: 12px;
            }
        }

        /* Дополнительные стили для улучшения UX */
        .form-group:focus-within .form-label {
            color: #3AAACF;
        }

        /* Анимация появления */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Авторизация</h1>
            <p class="login-subtitle">Введите ваши учетные данные</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Логин</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Введите ваш логин"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Введите ваш пароль"
                    required
                >
            </div>

            <button type="submit" class="login-button">Войти</button>

            <div class="form-footer">
                <a href="#" class="forgot-password">Забыли пароль?</a>
            </div>
        </form>
    </div>

    <script>
        // Простой скрипт для улучшения UX
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const inputs = document.querySelectorAll('.form-input');

            // Добавляем обработчики для улучшения UX
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });

                input.addEventListener('blur', function() {
                    if (this.value === '') {
                        this.parentElement.classList.remove('focused');
                    }
                });
            });

            // Обработка отправки формы
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                // Здесь можно добавить AJAX запрос или другую логику
                console.log('Форма отправлена');
                // Для демонстрации просто показываем alert
                alert('Форма отправлена! В реальном приложении здесь будет перенаправление или AJAX запрос.');
            });
        });
    </script>
</body>
</html>
