<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Авторизация</h1>
            <p class="login-subtitle">Введите ваши учетные данные</p>
        </div>

        <form action="/login" method="POST" id="login-form">
            <div class="db-error" id="db-error">
                {{ dbError }}
            </div>
            <div class="form-group">
                <label for="login" class="form-label">Логин</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    class="form-input"
                    placeholder="Введите ваш логин"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <div class="password-group">
                  <input
                      type="password"
                      id="password"
                      name="password"
                      class="form-input"
                      placeholder="Введите ваш пароль"
                      required
                  >
                  <button type="button" class="visible-button" id="password-visible-button">&#x1F441</button>
                </div>
            </div>

            <button type="submit" class="login-button">Войти</button>

            <div class="form-footer">
                <a href="#" class="forgot-password">Забыли пароль?</a>
                <br>
                <a href="/signup" class="forgot-password">Зарегистрироваться</a>
            </div>
        </form>
    </div>
    <script src="./js/login.js" charset="utf-8"></script>
</body>
</html>
